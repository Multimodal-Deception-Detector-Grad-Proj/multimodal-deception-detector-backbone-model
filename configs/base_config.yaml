audio:
  data_dir: data/processed/audio
  stats_path: configs/audio_normalization_stats.json
  checkpoint_dir: checkpoints
  predictions_dir: outputs
  model:
    prosody_only: true
    d_hidden: 48
    dropout: 0.4
    d_latent: 256        # provisional: must match the fusion latent
  train:
    epochs: 60
    patience: 12
    batch_size: 32
    lr: 3.0e-4
    weight_decay: 5.0e-2
    smoothing_window: 3
    seeds: [0, 1, 2, 3, 4]
  augment:
    noise: 0.1
    max_time_mask: 20
    max_freq_mask: 8
  # audio_present gate, read by extract_audio.py. A clip failing any enabled check is saved as zeros with
  # audio_present = False. null switches a check off. Tune with:  python -m src.extractors.audio.extract_audio quality-report
  quality:
    enabled: true
    min_valid_frames: 12          # real frames at 25 fps (12 = 0.48 s)
    min_rms_db: -55.0             # near-silent clip
    max_clipped_fraction: 0.01    # heavy clipping
    min_level_range_db: null      # crude noise proxy (p90 - p10 of frame loudness); choose after quality-report
    min_voiced_ratio: null        # clips with almost no voiced speech; choose after quality-report